[tool.poetry]
name = "pomodoro-timer"
version = "0.1.0"
description = "Python implementation of a pomodoro timer"
authors = ["James Santos-Calacat"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pyobjc = "10.1"
simpleaudio = "^1.0.4"
pynput = "^1.7.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.1"
pre-commit = "^3.4.0"

[tool.poetry.scripts]
pomodoro-timer = "pomodoro_timer:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pynput.*", "simpleaudio.*"]
ignore_missing_imports = true
